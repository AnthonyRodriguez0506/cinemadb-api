services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cinemadb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cinemadb
      POSTGRES_USER: anthony
      POSTGRES_PASSWORD: tu_contraseña
    ports:
      - "5432:5432"